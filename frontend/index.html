<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gotify Desktop</title>
</head>
<body>
<div id="app">
    <section id="setup-view" class="view">
        <div class="setup-card">
            <h1 data-i18n="setup.title">Gotify Desktop</h1>
            <p class="lede" data-i18n="setup.lede">Connect once with your Gotify credentials. Server URL and username are remembered; a client token is stored for the stream. The password is never saved.</p>
            <form id="setup-form">
                <label>
                    <span data-i18n="setup.server_url">Server URL</span>
                    <input id="server-url" name="serverUrl" type="url" data-i18n="setup.server_placeholder" data-i18n-attr="placeholder" placeholder="https://gotify.example.com" required autocomplete="url"/>
                </label>
                <label>
                    <span data-i18n="setup.username">Username</span>
                    <input id="username" name="username" type="text" required autocomplete="username"/>
                </label>
                <label>
                    <span data-i18n="setup.password">Password</span>
                    <input id="password" name="password" type="password" required autocomplete="current-password"/>
                </label>
                <p id="error" class="error" hidden></p>
                <button id="connect-btn" type="submit" data-i18n="setup.connect">Connect</button>
            </form>
            <p id="status-line" class="status"></p>
        </div>
    </section>
    <section id="gotify-view" class="view" hidden>
        <iframe id="gotify-frame" title="Gotify" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
    </section>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
